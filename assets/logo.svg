<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="50%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E1B" />
      <stop offset="100%" stop-color="#FFE072" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main Brand Name -->
  <text x="5" y="44" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="42" letter-spacing="4" fill="#FFFFFF">
    BL<tspan fill="url(#goldOrange)">OO</tspan>M
  </text>
  <!-- Botanical Leaf Icon over the O's -->
  <path d="M125 15 C130 5, 142 6, 145 12 C140 18, 132 18, 125 15 Z" fill="url(#leafGrad)" />
  <path d="M143 13 C149 8, 158 11, 157 18 C150 19, 145 16, 143 13 Z" fill="url(#leafGrad)" />
  <!-- Subtitle -->
  <text x="8" y="55" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="3.5" fill="#FFB800">
    NATURAL WEIGHT GAINER
  </text>
</svg>